<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141519">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="出图纸">
<title>出图纸</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#141519;--bg2:#1a1b20;--card:#1f2026;--card2:#26272e;
  --line:#2e2f37;--ink:#e8e8ea;--dim:#8d8d96;--dim2:#63646d;
  --acc:#c4797a;--acc2:#d8918f;--ok:#5f9e74;--bad:#b1554f;--ai:#5b7fa8;--lib:#8a7a4e;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh}

/* ── 顶栏 ── */
#hdr{flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:calc(6px + var(--safe-t)) 10px 8px;background:var(--bg2);
  border-bottom:1px solid var(--line);position:relative;z-index:5}
#hdr button{background:none;border:0;color:var(--ink);font-size:19px;
  width:38px;height:38px;border-radius:10px;cursor:pointer;position:relative}
#hdr button:active{background:#2a2b32}
.hdr-c{flex:1;text-align:center;min-width:0}
#title{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-s{font-size:11px;color:var(--dim2)}
#convCount{position:absolute;top:2px;right:2px;font-size:9px;color:var(--acc2);
  background:#2a2b32;border-radius:6px;padding:0 4px}
#cfgDot{display:none}

/* ── 消息区 ── */
#msgs{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:12px 10px 20px;
  -webkit-overflow-scrolling:touch}
.row{display:flex;margin:0 0 12px}
.row-u{justify-content:flex-end}
.row-a{justify-content:flex-start}
.bub{max-width:88%;padding:9px 12px;border-radius:14px;word-break:break-word;
  white-space:normal;font-size:15px}
.bub-u{background:var(--acc);color:#1a1213;border-bottom-right-radius:4px}
.bub-a{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub-a.cannot{background:#2b2430;border-color:#4a3a4e}
.bub-a.err{background:#2b2324;border-color:#5a3a38;color:#e2b6b2}
.ans{width:100%;max-width:100%}
.ans>.bub-a{display:inline-block;max-width:92%}
.notice{margin:6px 0 0;font-size:12px;color:#d0a86a;background:#2a2419;
  border:1px solid #4a3d22;border-radius:8px;padding:6px 9px}
.meta{margin:10px 0 0;font-size:11px;color:var(--dim2);text-align:right}

/* 想一下 */
.thinking{display:flex;align-items:center;gap:8px;color:var(--dim)}
.spin{width:13px;height:13px;border:2px solid #3a3b44;border-top-color:var(--acc);
  border-radius:50%;animation:sp .8s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.th-txt{font-size:13px}

/* ── 方案卡 ── */
.cards{margin:10px 0 0;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:11px;overflow:hidden}
.card-hd{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.card-n{flex:0 0 auto;width:21px;height:21px;border-radius:50%;background:var(--acc);
  color:#1a1213;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.card-name{font-size:15px;font-weight:600;line-height:1.35}
/* ⚠️ 图是【深色线条 + 透明底】，卡片背景是深色 → 叠上去几乎看不见。
   必须给白底，否则"图上啥也没有"是假的（线条画了，只是跟背景一个色）。 */
.thumb{background:#fff;border:1px solid #23242b;border-radius:9px;
  overflow:hidden;height:180px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative}
.thumb svg{width:100%;height:100%;max-height:180px;object-fit:contain}
.thumb::after{content:"点开看细节";position:absolute;right:6px;bottom:5px;
  font-size:10px;color:#8a8a92;background:rgba(255,255,255,.85);
  border-radius:5px;padding:1px 5px;pointer-events:none}
.thumb-miss{color:var(--bad);font-size:13px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 0}
.bg{font-size:10.5px;padding:2px 7px;border-radius:6px;border:1px solid transparent}
.bg-ok{color:#8fc4a0;background:#1d2a22;border-color:#2c4034}
.bg-bad{color:#e0a09b;background:#2c1f1e;border-color:#4a2f2c}
.bg-ai{color:#9db9d6;background:#1b2430;border-color:#2a3a4c}
.bg-lib{color:#c9b483;background:#2a2519;border-color:#443b24}
.bg-dim{color:var(--dim);background:#23242b;border-color:#2e2f37}
.why,.assume,.basis,.warn{margin:7px 0 0;font-size:12.5px;line-height:1.5}
.why{color:#c8c8ce}
.assume{color:#d5b98a}
.basis{color:var(--dim);font-size:11.5px}
.warn{color:#d0a86a;font-size:11.5px}
.card-ft{display:flex;gap:6px;margin:10px 0 0;flex-wrap:wrap}
.btn-s{flex:1 1 auto;min-width:70px;background:var(--card2);border:1px solid var(--line);
  color:var(--ink);border-radius:9px;padding:8px 6px;font-size:12.5px;cursor:pointer}
.btn-s:active{background:#32333c}
.btn-good{background:#3a2a2b;border-color:#6a4344;color:#e8b3b2}
.chips{display:flex;gap:6px;margin:10px 0 0;flex-wrap:wrap}
.chip-q{background:#23242b;border:1px dashed #3d3e48;color:#b9b9c2;
  border-radius:16px;padding:6px 11px;font-size:12.5px;cursor:pointer}

/* ── 首页 hero ── */
.hero{padding:34px 4px 10px;text-align:center}
.hero-t{font-size:25px;font-weight:700;letter-spacing:1px}
.hero-s{color:var(--dim);font-size:13.5px;margin:7px 0 20px}
.btn-setup{width:100%;background:var(--acc);color:#1a1213;border:0;border-radius:12px;
  padding:14px;font-size:15px;font-weight:600;cursor:pointer;margin:0 0 22px}
.ex{text-align:left;color:var(--dim2);font-size:12px;margin:0 0 8px 2px}
.ex-list{display:flex;flex-direction:column;gap:8px}
.ex-item{text-align:left;background:var(--card);border:1px solid var(--line);
  color:#d6d6dc;border-radius:11px;padding:12px 14px;font-size:14px;cursor:pointer}
.ex-item:active{background:var(--card2)}
.hero-ft{margin:22px 0 0;color:var(--dim2);font-size:11.5px}

/* ── 底栏 ── */
#ft{flex:0 0 auto;background:var(--bg2);border-top:1px solid var(--line);
  padding:8px 10px calc(8px + var(--safe-b))}
.ft-row{display:flex;gap:8px;align-items:flex-end}
#ta{flex:1;background:var(--card);border:1px solid var(--line);color:var(--ink);
  border-radius:20px;padding:10px 14px;font-size:15px;font-family:inherit;line-height:1.4;
  resize:none;max-height:120px;outline:none}
#ta:focus{border-color:#4a4b56}
#send{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--acc);
  border:0;color:#1a1213;font-size:19px;font-weight:700;cursor:pointer}
#send:disabled{opacity:.4}

/* ── 覆盖层 ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;
  align-items:flex-end}
.ov.on{display:flex}
.sheet{width:100%;max-height:92dvh;background:var(--bg2);border-radius:18px 18px 0 0;
  display:flex;flex-direction:column;overflow:hidden;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-hd{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;
  border-bottom:1px solid var(--line)}
.sheet-hd h3{margin:0;font-size:16px;font-weight:600;flex:1}
.sheet-hd button{background:none;border:0;color:var(--dim);font-size:15px;cursor:pointer;padding:4px 2px}
.sheet-bd{padding:14px 16px calc(18px + var(--safe-b));overflow-y:auto}

/* 大图 */
#viewer .sheet{max-height:96dvh;height:96dvh}
#vBadges{padding:8px 14px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
#vBody{flex:1;overflow:auto;background:#0c0d10;padding:8px;-webkit-overflow-scrolling:touch}
#vBody svg{width:1500px;height:auto;display:block;background:#fff;border-radius:4px}
.viewer-ft{display:flex;gap:8px;padding:10px 14px calc(12px + var(--safe-b));
  border-top:1px solid var(--line)}

/* 设置 */
.fld{margin:0 0 14px}
.fld label{display:block;font-size:12.5px;color:var(--dim);margin:0 0 6px}
.fld select,.fld input{width:100%;background:var(--card);border:1px solid var(--line);
  color:var(--ink);border-radius:10px;padding:11px 12px;font-size:14px;font-family:inherit;outline:none}
.fld input:focus,.fld select:focus{border-color:#4a4b56}
.p-msg{font-size:12.5px;margin:0 0 12px;min-height:18px}
.p-msg.ok{color:#8fc4a0}
.p-msg.bad{color:#e0a09b}
.p-tip{font-size:11.5px;color:var(--dim2);line-height:1.6;margin:0 0 14px;
  background:#1d1e23;border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.p-row{display:flex;gap:8px}
.p-row button{flex:1;border-radius:11px;padding:12px;font-size:14px;cursor:pointer;
  border:1px solid var(--line);background:var(--card2);color:var(--ink)}
#pSave{background:var(--acc);border-color:var(--acc);color:#1a1213;font-weight:600}

/* 对话列表 */
.conv{display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin:0 0 8px;cursor:pointer}
.conv-on{border-color:var(--acc);background:#241e1f}
.conv-t{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-s{font-size:11.5px;color:var(--dim2);flex:0 0 auto}
.conv-del{background:none;border:0;color:#8a5a56;font-size:12px;cursor:pointer;padding:4px}
#newConvBtn{width:100%;background:var(--acc);border:0;color:#1a1213;font-weight:600;
  border-radius:11px;padding:13px;font-size:14.5px;cursor:pointer;margin:6px 0 0}
</style>
</head>
<body>

<header id="hdr">
  <button id="hList" data-act="list" aria-label="对话列表">☰<span id="convCount"></span></button>
  <div class="hdr-c"><div id="title">出图纸</div><div class="hdr-s">一句话就出图</div></div>
  <button id="hSet" data-act="setup" aria-label="设置">⚙️</button>
</header>
<span id="cfgDot"></span>

<main id="msgs"></main>

<footer id="ft">
  <div class="ft-row">
    <textarea id="ta" rows="1" placeholder="说你要什么柜子…" enterkeyhint="send"></textarea>
    <button id="send" aria-label="发送">↑</button>
  </div>
</footer>

<!-- 大图查看器 -->
<div class="ov" id="viewer">
  <div class="sheet">
    <div class="sheet-hd">
      <h3 id="vTitle">图纸</h3>
      <button id="vSave">存/打印</button>
      <button id="closeV">关闭</button>
    </div>
    <div id="vBadges"></div>
    <div id="vBody"></div>
    <div class="viewer-ft" style="font-size:11.5px;color:#63646d">
      左右拖动看全图 · 双击切换「整页 / 放大」
    </div>
  </div>
</div>

<!-- 设置 -->
<div class="ov" id="setup">
  <div class="sheet">
    <div class="sheet-hd">
      <h3>AI 接口设置</h3>
      <button id="closeS">关闭</button>
    </div>
    <div class="sheet-bd">
      <div class="p-tip">
        只需要填一次，存在这台手机上，<b>不经过任何服务器</b>。<br>
        推荐 <b>DeepSeek</b>（最便宜，几厘钱一张图）或 <b>智谱 GLM</b>（有免费额度）。<br>
        密钥在对应网站的「API Keys」页面申请。
      </div>
      <div class="fld"><label>用哪一家</label><select id="pSel"></select></div>
      <div class="fld"><label>接口地址</label><input id="pBase" placeholder="https://…/v1" autocapitalize="off" autocorrect="off"></div>
      <div class="fld"><label>模型名</label><input id="pModel" placeholder="deepseek-chat" autocapitalize="off" autocorrect="off"></div>
      <div class="fld"><label>密钥（sk-…）</label><input id="pKey" type="password" placeholder="sk-…" autocapitalize="off" autocorrect="off"></div>
      <div class="p-msg" id="pMsg"></div>
      <div class="p-row">
        <button id="pTest">试一下</button>
        <button id="pSave">保存</button>
      </div>
      <div class="p-row" style="margin-top:8px">
        <button id="pClear">清掉密钥</button>
      </div>
    </div>
  </div>
</div>

<!-- 对话列表 -->
<div class="ov" id="list">
  <div class="sheet">
    <div class="sheet-hd"><h3>所有对话</h3><button id="closeL">关闭</button></div>
    <div class="sheet-bd">
      <div id="listBody"></div>
      <button id="newConvBtn">+ 开个新对话</button>
    </div>
  </div>
</div>

<script src="ref_draw.js"></script>
<script src="data.js"></script>
<script src="cap_rules.js"></script>
<script src="prompts.js"></script>
<script src="lib.js"></script>
<script src="capability.js"></script>
<script src="render.js"></script>
<script src="llm.js"></script>
<script src="agent.js"></script>
<script src="app.js"></script>
</body>
</html>
